name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend lint, typecheck, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Real PostgreSQL + pgvector — Issue #2's integration/security tests
      # exercise auth and workspace isolation against a real database, per
      # docs/DECISIONS/0002 (no sqlite substitute). Service container ports
      # are published to `localhost` on the job's own runner.
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: ragpass
          POSTGRES_DB: ragdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raguser -d ragdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # ADR 0006 §16 — real Redis for the token-bucket engine's own
      # integration tests (backend/tests/test_redis_*.py); not yet
      # consumed by any request path (see docs/DECISIONS/0006).
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://raguser:ragpass@localhost:5432/ragdb
      SECRET_KEY: ci-test-secret-key-not-for-production
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy .

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest -v

  frontend:
    name: Frontend lint, typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: infra/docker/backend.Dockerfile
          push: false

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: infra/docker/frontend.Dockerfile
          push: false

      - name: Validate Docker Compose configuration
        run: docker compose -f infra/compose/docker-compose.yml config
