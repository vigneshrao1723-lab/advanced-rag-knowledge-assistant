# Local development stack only (docs/DEPLOYMENT.md). Production packaging
# and deployment configuration are Issue #8's concern.
#
# Usage: from the repository root, `docker compose -f infra/compose/docker-compose.yml up --build`

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dev-only SMTP capture (docs/ARCHITECTURE.md "Provider abstractions" —
  # EmailProvider): password-reset emails land here instead of a real
  # inbox. Web UI + REST API at http://localhost:8025 (Playwright reads
  # the reset email via the API — see docs/DEPLOYMENT.md). Never used in
  # production — a real deployment points EMAIL_PROVIDER at a real
  # SMTP host/relay instead.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI + REST API

  # ADR 0006 §16 — local dev/CI only, as designed. Not yet consumed by any
  # request path (the Redis-backed rate limiter is implemented but not
  # wired into any endpoint this slice — see docs/DECISIONS/0006). Present
  # here so the engine's own tests (backend/tests/test_redis_*.py) have a
  # real Redis to run against locally, matching the "no mock substitute
  # for the real datastore" precedent ADR 0002 established for Postgres.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Free, local answer-generation model (ADR 0009, docs/AI_SETUP.md). Opt-in
  # via the `llm` profile so a plain `docker compose up` never downloads
  # anything; infra/scripts/setup-local-llm.sh starts it and pulls a model.
  # CPU by default; add docker-compose.gpu.yml for an NVIDIA GPU.
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://raguser:ragpass@db:5432/ragdb}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Local-dev-only placeholder — override with a real generated secret
      # (e.g. `openssl rand -hex 32`) via a `.env` file for anything beyond
      # a throwaway local stack; never commit a real value.
      SECRET_KEY: ${SECRET_KEY:-local-dev-only-secret-do-not-use-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      # ADR 0006 §7/§16 — ephemeral rate-limit/abuse state only, never a
      # second source of truth. Optional: the backend starts and serves
      # traffic normally even if this is unset or Redis is unreachable
      # (ADR 0006 §13) — this dependency is a container-startup-ordering
      # convenience for local dev only, not a runtime requirement.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Answer generation (ADR 0009). Defaults to the local Ollama service
      # (`--profile llm`, see docs/AI_SETUP.md). If the model is not running
      # the chat says so; it never falls back to pasting raw excerpts. Set
      # LLM_PROVIDER=extractive only for offline demos/tests.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-rag-assistant}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      # Speech-to-text (ADR 0010): a local neural model (faster-whisper), far
      # more accurate than the legacy PocketSphinx. The model is NOT
      # downloaded automatically: run infra/scripts/setup-local-stt.sh once
      # (~460 MB for "small"). Until then the app says so; it does not hang.
      SPEECH_TO_TEXT_PROVIDER: ${SPEECH_TO_TEXT_PROVIDER:-faster_whisper}
      STT_MODEL: ${STT_MODEL:-small}
      STT_LANGUAGE: ${STT_LANGUAGE:-}
      STT_MODEL_DIR: /app/data/models
    volumes:
      # Local-dev persistence for uploaded documents (StorageProvider's
      # "local" implementation, app/core/config.py's storage_local_root,
      # default ./data/documents -- WORKDIR /app -- resolves to
      # /app/data/documents). Without this, uploads live only in the
      # container's own writable layer and are silently lost on every
      # `docker compose up --build`/recreate, unlike Postgres (which
      # already has its own db_data volume below) -- not a production
      # storage solution (see docs/PRODUCTION_READINESS.md "What
      # remains unverified" for why a real object-storage
      # StorageProvider implementation is still needed for an actual
      # deployment), just parity with how the database is already
      # treated for local dev.
      - backend_documents:/app/data/documents
      # Speech models installed by infra/scripts/setup-local-stt.sh.
      - stt_models:/app/data/models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  backend_documents:
  stt_models:
  ollama_models:
