# Optional NVIDIA GPU access for the local Ollama model (docs/AI_SETUP.md).
# Use together with the main file:
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.gpu.yml --profile llm up -d ollama
# Requires an NVIDIA GPU and (on Windows) Docker Desktop with the WSL2 backend.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
